<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arr3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#6B7280"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#5ABB4A"/>
    </marker>
    <marker id="arrD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#DC2626"/>
    </marker>
  </defs>

  <text x="60" y="52" font-size="28" font-weight="700" fill="#111827">Two correct solutions, two different topologies</text>
  <text x="60" y="82" font-size="16" fill="#6B7280">SETNX for truly distributed deployments. Caffeine for sticky-session single-node arbitration.</text>

  <!-- Divider line -->
  <line x1="600" y1="130" x2="600" y2="690" stroke="#E5E7EB" stroke-dasharray="4 4"/>

  <!-- LEFT COLUMN - SETNX -->
  <rect x="60" y="130" width="520" height="60" rx="10" fill="#ECFDF5" stroke="#5ABB4A" stroke-width="2"/>
  <text x="320" y="156" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">Option 1 · Redis SETNX</text>
  <text x="320" y="178" text-anchor="middle" font-size="12" fill="#374151">Atomic across every node, every pool. No sticky sessions required.</text>

  <!-- 3 requests -->
  <rect x="80" y="220" width="130" height="40" rx="8" fill="#F3F4F6"/>
  <text x="145" y="245" text-anchor="middle" font-size="13" fill="#111827">Request A</text>
  <rect x="235" y="220" width="130" height="40" rx="8" fill="#F3F4F6"/>
  <text x="300" y="245" text-anchor="middle" font-size="13" fill="#111827">Request B</text>
  <rect x="390" y="220" width="130" height="40" rx="8" fill="#F3F4F6"/>
  <text x="455" y="245" text-anchor="middle" font-size="13" fill="#111827">Request C</text>

  <!-- Arrows down to Redis -->
  <line x1="145" y1="260" x2="250" y2="340" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arr3)"/>
  <line x1="300" y1="260" x2="320" y2="340" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arr3)"/>
  <line x1="455" y1="260" x2="390" y2="340" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arr3)"/>

  <!-- Redis box -->
  <rect x="150" y="350" width="340" height="90" rx="12" fill="#111827"/>
  <text x="320" y="378" text-anchor="middle" font-size="14" font-weight="700" fill="#5ABB4A" letter-spacing="2">REDIS</text>
  <text x="320" y="402" text-anchor="middle" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#E5E7EB">SET token "used" NX EX 1800</text>
  <text x="320" y="422" text-anchor="middle" font-size="11" fill="#9CA3AF">atomic test-and-set</text>

  <!-- Outcomes -->
  <rect x="80" y="480" width="130" height="60" rx="8" fill="#DCFCE7" stroke="#5ABB4A"/>
  <text x="145" y="505" text-anchor="middle" font-size="12" font-weight="700" fill="#166534">A: wins</text>
  <text x="145" y="525" text-anchor="middle" font-size="11" fill="#166534">→ 200 OK</text>

  <rect x="235" y="480" width="130" height="60" rx="8" fill="#FEE2E2" stroke="#DC2626"/>
  <text x="300" y="505" text-anchor="middle" font-size="12" font-weight="700" fill="#991B1B">B: taken</text>
  <text x="300" y="525" text-anchor="middle" font-size="11" fill="#991B1B">→ 409 Conflict</text>

  <rect x="390" y="480" width="130" height="60" rx="8" fill="#FEE2E2" stroke="#DC2626"/>
  <text x="455" y="505" text-anchor="middle" font-size="12" font-weight="700" fill="#991B1B">C: taken</text>
  <text x="455" y="525" text-anchor="middle" font-size="11" fill="#991B1B">→ 409 Conflict</text>

  <!-- Pros box -->
  <rect x="60" y="570" width="520" height="110" rx="10" fill="#F0FDF4" stroke="#86EFAC"/>
  <text x="80" y="595" font-size="13" font-weight="700" fill="#166534">Pick when:</text>
  <text x="80" y="618" font-size="12" fill="#374151">· Multi-node deployment without sticky sessions</text>
  <text x="80" y="636" font-size="12" fill="#374151">· Horizontal autoscaling: pods come and go</text>
  <text x="80" y="654" font-size="12" fill="#374151">· The extra Redis round-trip is affordable</text>
  <text x="80" y="672" font-size="12" fill="#374151">· You want one-and-only-one correctness as a hard guarantee</text>

  <!-- RIGHT COLUMN - Caffeine -->
  <rect x="620" y="130" width="520" height="60" rx="10" fill="#F0F9FF" stroke="#0EA5E9" stroke-width="2"/>
  <text x="880" y="156" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">Option 2 · Caffeine + sticky sessions</text>
  <text x="880" y="178" text-anchor="middle" font-size="12" fill="#374151">In-process, O(1), zero round-trip. Requires session affinity.</text>

  <!-- 3 requests same session -->
  <rect x="640" y="220" width="130" height="40" rx="8" fill="#F3F4F6"/>
  <text x="705" y="245" text-anchor="middle" font-size="13" fill="#111827">A (session X)</text>
  <rect x="795" y="220" width="130" height="40" rx="8" fill="#F3F4F6"/>
  <text x="860" y="245" text-anchor="middle" font-size="13" fill="#111827">B (session X)</text>
  <rect x="950" y="220" width="130" height="40" rx="8" fill="#F3F4F6"/>
  <text x="1015" y="245" text-anchor="middle" font-size="13" fill="#111827">C (session X)</text>

  <!-- LB with sticky -->
  <rect x="760" y="285" width="240" height="40" rx="20" fill="#0EA5E9"/>
  <text x="880" y="310" text-anchor="middle" font-size="12" font-weight="700" fill="white">LOAD BALANCER · sticky</text>

  <line x1="705" y1="260" x2="820" y2="285" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arr3)"/>
  <line x1="860" y1="260" x2="880" y2="285" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arr3)"/>
  <line x1="1015" y1="260" x2="940" y2="285" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arr3)"/>

  <!-- All to one node -->
  <line x1="880" y1="325" x2="880" y2="360" stroke="#5ABB4A" stroke-width="2" marker-end="url(#arrG)"/>

  <!-- Node with Caffeine -->
  <rect x="680" y="365" width="400" height="130" rx="12" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="2"/>
  <rect x="680" y="365" width="400" height="34" rx="12" fill="#111827"/>
  <text x="880" y="388" text-anchor="middle" font-size="12" font-weight="700" fill="#5ABB4A">NODE 1 · JVM</text>

  <rect x="700" y="415" width="360" height="68" rx="8" fill="#F0F9FF" stroke="#0EA5E9"/>
  <text x="880" y="438" text-anchor="middle" font-size="13" font-weight="700" fill="#0C4A6E">Caffeine cache</text>
  <text x="880" y="458" text-anchor="middle" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#0C4A6E">putIfAbsent(token, true)</text>
  <text x="880" y="474" text-anchor="middle" font-size="10" fill="#0C4A6E">expireAfterWrite 30m · maximumSize 1,000</text>

  <!-- Outcomes -->
  <rect x="640" y="520" width="130" height="40" rx="8" fill="#DCFCE7" stroke="#5ABB4A"/>
  <text x="705" y="545" text-anchor="middle" font-size="11" font-weight="700" fill="#166534">A → 200 OK</text>
  <rect x="795" y="520" width="130" height="40" rx="8" fill="#FEE2E2" stroke="#DC2626"/>
  <text x="860" y="545" text-anchor="middle" font-size="11" font-weight="700" fill="#991B1B">B → 409</text>
  <rect x="950" y="520" width="130" height="40" rx="8" fill="#FEE2E2" stroke="#DC2626"/>
  <text x="1015" y="545" text-anchor="middle" font-size="11" font-weight="700" fill="#991B1B">C → 409</text>

  <!-- Pros box -->
  <rect x="620" y="570" width="520" height="110" rx="10" fill="#F0F9FF" stroke="#7DD3FC"/>
  <text x="640" y="595" font-size="13" font-weight="700" fill="#0C4A6E">Pick when:</text>
  <text x="640" y="618" font-size="12" fill="#374151">· Sticky sessions already enforced for other reasons</text>
  <text x="640" y="636" font-size="12" fill="#374151">· Latency budget doesn’t afford a Redis round-trip per check</text>
  <text x="640" y="654" font-size="12" fill="#374151">· Need bounded memory under replay/DoS traffic (maxSize cap)</text>
  <text x="640" y="672" font-size="12" fill="#374151">· Node 1 handling the session can serialise the check in-process</text>
</svg>
