<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#6B7280"/>
    </marker>
  </defs>

  <text x="60" y="52" font-size="28" font-weight="700" fill="#111827">Why JVM-level locks don’t save you</text>
  <text x="60" y="82" font-size="16" fill="#6B7280">Two requests, same token, land on two different nodes. Each JVM’s lock sees nothing to contend with.</text>

  <!-- Clients at top -->
  <g>
    <rect x="110" y="130" width="190" height="60" rx="12" fill="#F3F4F6" stroke="#D1D5DB"/>
    <text x="205" y="156" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">Request A</text>
    <text x="205" y="176" text-anchor="middle" font-size="12" fill="#6B7280">token = abc123</text>

    <rect x="900" y="130" width="190" height="60" rx="12" fill="#F3F4F6" stroke="#D1D5DB"/>
    <text x="995" y="156" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">Request B</text>
    <text x="995" y="176" text-anchor="middle" font-size="12" fill="#6B7280">token = abc123</text>
  </g>

  <!-- Load balancer -->
  <rect x="430" y="140" width="340" height="60" rx="30" fill="#111827"/>
  <text x="600" y="166" text-anchor="middle" font-size="14" font-weight="700" fill="#5ABB4A" letter-spacing="2">LOAD BALANCER</text>
  <text x="600" y="186" text-anchor="middle" font-size="11" fill="#9CA3AF">no sticky sessions</text>

  <!-- Arrows from clients to LB -->
  <line x1="300" y1="170" x2="428" y2="170" stroke="#6B7280" stroke-width="2" marker-end="url(#arr2)"/>
  <line x1="900" y1="170" x2="772" y2="170" stroke="#6B7280" stroke-width="2" marker-end="url(#arr2)"/>

  <!-- Arrows from LB down to two nodes -->
  <line x1="500" y1="202" x2="300" y2="286" stroke="#6B7280" stroke-width="2" marker-end="url(#arr2)"/>
  <line x1="700" y1="202" x2="900" y2="286" stroke="#6B7280" stroke-width="2" marker-end="url(#arr2)"/>

  <!-- Node 1 -->
  <rect x="100" y="290" width="400" height="200" rx="18" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="2"/>
  <rect x="100" y="290" width="400" height="42" rx="18" fill="#111827"/>
  <text x="300" y="318" text-anchor="middle" font-size="14" font-weight="700" fill="#5ABB4A">NODE 1 · JVM</text>

  <rect x="130" y="356" width="340" height="38" rx="8" fill="white" stroke="#D1D5DB"/>
  <text x="300" y="380" text-anchor="middle" font-size="13" fill="#111827">Spring Boot · HTTP handler</text>

  <rect x="130" y="410" width="340" height="60" rx="8" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
  <text x="300" y="434" text-anchor="middle" font-size="13" font-weight="700" fill="#92400E">synchronized(session) { … }</text>
  <text x="300" y="454" text-anchor="middle" font-size="12" fill="#92400E">lock scope = this JVM only</text>

  <!-- Node 2 -->
  <rect x="700" y="290" width="400" height="200" rx="18" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="2"/>
  <rect x="700" y="290" width="400" height="42" rx="18" fill="#111827"/>
  <text x="900" y="318" text-anchor="middle" font-size="14" font-weight="700" fill="#5ABB4A">NODE 2 · JVM</text>

  <rect x="730" y="356" width="340" height="38" rx="8" fill="white" stroke="#D1D5DB"/>
  <text x="900" y="380" text-anchor="middle" font-size="13" fill="#111827">Spring Boot · HTTP handler</text>

  <rect x="730" y="410" width="340" height="60" rx="8" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
  <text x="900" y="434" text-anchor="middle" font-size="13" font-weight="700" fill="#92400E">synchronized(session) { … }</text>
  <text x="900" y="454" text-anchor="middle" font-size="12" fill="#92400E">lock scope = this JVM only</text>

  <!-- Both nodes to Redis -->
  <line x1="300" y1="490" x2="500" y2="570" stroke="#6B7280" stroke-width="2" marker-end="url(#arr2)"/>
  <line x1="900" y1="490" x2="700" y2="570" stroke="#6B7280" stroke-width="2" marker-end="url(#arr2)"/>

  <!-- Redis -->
  <rect x="430" y="570" width="340" height="70" rx="12" fill="#111827"/>
  <text x="600" y="601" text-anchor="middle" font-size="14" font-weight="700" fill="#5ABB4A" letter-spacing="2">REDIS</text>
  <text x="600" y="622" text-anchor="middle" font-size="11" fill="#9CA3AF">shared session store · token: "abc123"</text>

  <!-- Big "X" overlay -->
  <text x="600" y="270" text-anchor="middle" font-size="18" font-weight="700" fill="#DC2626">↓ Request A to Node 1 · Request B to Node 2 ↓</text>

  <!-- Bottom caption -->
  <rect x="60" y="665" width="1080" height="42" rx="10" fill="#FEF2F2" stroke="#FECACA"/>
  <text x="80" y="690" font-size="14" fill="#374151">
    <tspan font-weight="700" fill="#991B1B">The problem:</tspan>
    <tspan> both JVMs successfully “lock” their own session copy. Neither JVM knows the other exists. Both requests pass through.</tspan>
  </text>
</svg>
