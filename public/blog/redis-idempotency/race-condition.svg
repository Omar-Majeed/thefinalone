<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#9CA3AF"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#DC2626"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="60" y="52" font-size="28" font-weight="700" fill="#111827">The race condition under concurrent requests</text>
  <text x="60" y="82" font-size="16" fill="#6B7280">Both requests observe the token as present before either has invalidated it. Both pass.</text>

  <!-- Lane headers -->
  <rect x="150" y="130" width="260" height="46" rx="10" fill="#F3F4F6"/>
  <text x="280" y="159" text-anchor="middle" font-size="16" font-weight="600" fill="#111827">Request A</text>

  <rect x="470" y="130" width="260" height="46" rx="10" fill="#F3F4F6"/>
  <text x="600" y="159" text-anchor="middle" font-size="16" font-weight="600" fill="#111827">Request B</text>

  <rect x="790" y="130" width="320" height="46" rx="10" fill="#111827"/>
  <text x="950" y="155" text-anchor="middle" font-size="14" font-weight="700" fill="#5ABB4A" letter-spacing="2">REDIS</text>
  <text x="950" y="170" text-anchor="middle" font-size="10" fill="#9CA3AF">Session store · token: "abc123"</text>

  <!-- Lifelines -->
  <line x1="280" y1="186" x2="280" y2="620" stroke="#D1D5DB" stroke-dasharray="4 4"/>
  <line x1="600" y1="186" x2="600" y2="620" stroke="#D1D5DB" stroke-dasharray="4 4"/>
  <line x1="950" y1="186" x2="950" y2="620" stroke="#D1D5DB" stroke-dasharray="4 4"/>

  <!-- Time axis -->
  <text x="60" y="230" font-size="12" fill="#9CA3AF">T₁</text>
  <text x="60" y="320" font-size="12" fill="#9CA3AF">T₂</text>
  <text x="60" y="410" font-size="12" fill="#9CA3AF">T₃</text>
  <text x="60" y="500" font-size="12" fill="#9CA3AF">T₄</text>

  <!-- T1: both read session -->
  <line x1="280" y1="230" x2="945" y2="230" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="612" y="222" font-size="12" fill="#374151">read session.token</text>

  <line x1="600" y1="245" x2="945" y2="245" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="772" y="238" font-size="12" fill="#374151">read session.token</text>

  <!-- Response arrows coming back -->
  <line x1="945" y1="275" x2="285" y2="275" stroke="#5ABB4A" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="612" y="268" font-size="12" fill="#047857" font-weight="600">"abc123" ✓ present</text>

  <line x1="945" y1="290" x2="605" y2="290" stroke="#5ABB4A" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="772" y="304" font-size="12" fill="#047857" font-weight="600">"abc123" ✓ present</text>

  <!-- Race box annotation -->
  <rect x="760" y="200" width="380" height="110" rx="12" fill="none" stroke="#DC2626" stroke-dasharray="6 4" stroke-width="2"/>
  <rect x="1020" y="202" width="118" height="26" rx="13" fill="#DC2626"/>
  <text x="1079" y="220" text-anchor="middle" font-size="12" font-weight="700" fill="white">RACE WINDOW</text>

  <!-- T2: both decide to process -->
  <rect x="200" y="340" width="160" height="54" rx="10" fill="#FEF3C7" stroke="#F59E0B"/>
  <text x="280" y="362" text-anchor="middle" font-size="12" font-weight="600" fill="#92400E">token valid →</text>
  <text x="280" y="380" text-anchor="middle" font-size="12" font-weight="600" fill="#92400E">process request</text>

  <rect x="520" y="340" width="160" height="54" rx="10" fill="#FEF3C7" stroke="#F59E0B"/>
  <text x="600" y="362" text-anchor="middle" font-size="12" font-weight="600" fill="#92400E">token valid →</text>
  <text x="600" y="380" text-anchor="middle" font-size="12" font-weight="600" fill="#92400E">process request</text>

  <!-- T3: both write to DB -->
  <rect x="80" y="440" width="400" height="40" rx="10" fill="#FEE2E2" stroke="#DC2626"/>
  <text x="280" y="465" text-anchor="middle" font-size="13" font-weight="700" fill="#991B1B">INSERT INTO audit_log (…) — duplicate!</text>

  <rect x="400" y="490" width="400" height="40" rx="10" fill="#FEE2E2" stroke="#DC2626"/>
  <text x="600" y="515" text-anchor="middle" font-size="13" font-weight="700" fill="#991B1B">INSERT INTO audit_log (…) — duplicate!</text>

  <!-- T4: both try to invalidate (too late) -->
  <line x1="280" y1="560" x2="945" y2="560" stroke="#DC2626" stroke-width="1.5" marker-end="url(#arrR)"/>
  <text x="612" y="552" font-size="12" fill="#991B1B">removeAttribute("token")</text>

  <line x1="600" y1="580" x2="945" y2="580" stroke="#DC2626" stroke-width="1.5" marker-end="url(#arrR)"/>
  <text x="772" y="572" font-size="12" fill="#991B1B">removeAttribute("token") — too late</text>

  <!-- Bottom caption -->
  <rect x="60" y="650" width="1080" height="52" rx="10" fill="#FEF2F2" stroke="#FECACA"/>
  <text x="80" y="675" font-size="14" font-weight="700" fill="#991B1B">The bug:</text>
  <text x="140" y="675" font-size="14" fill="#374151">Both requests read the token at T₁ before either has written the invalidation at T₄.</text>
  <text x="80" y="693" font-size="14" fill="#374151">Classic time-of-check-to-time-of-use. Session attribute reads are not atomic across concurrent requests.</text>
</svg>
